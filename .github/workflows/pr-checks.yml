name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Stub local.properties
        run: |
          cat > local.properties <<EOF
          admob.app.id=ca-app-pub-0000000000000000~0000000000
          admob.banner.id=ca-app-pub-0000000000000000/0000000000
          admob.interstitial.id=ca-app-pub-0000000000000000/0000000000
          admob.native.advanced.id=ca-app-pub-0000000000000000/0000000000
          EOF
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  build-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Stub local.properties
        run: |
          cat > local.properties <<EOF
          admob.app.id=ca-app-pub-0000000000000000~0000000000
          admob.banner.id=ca-app-pub-0000000000000000/0000000000
          admob.interstitial.id=ca-app-pub-0000000000000000/0000000000
          admob.native.advanced.id=ca-app-pub-0000000000000000/0000000000
          EOF
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Assemble debug (includes native build)
        run: ./gradlew :app:assembleDebug --no-daemon
